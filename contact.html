
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | MED UIUC</title>
<link rel="stylesheet" href="assets/styles.css">
<script defer src="assets/script.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <div class="logo">MED UIUC</div>
    <button id="menuBtn" class="menu-btn">Menu</button>
    <nav id="navLinks" class="nav-links">
      <a href="index.html">Home</a>
      <a href="service.html">About</a>
      <a href="events.html">Rush</a>
      <a href="members.html">Members</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="section reveal">
  <div class="container form-card">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you - reach out with any questions or interest in joining MED.</p>
    <div class="form-grid">
      <div>
        <input class="input" type="text" id="name" placeholder="Your name">
      </div>
    
      <div>
        <input class="input" type="email" id="email" placeholder="Email">
      </div>
    
      <div class="full">
        <textarea id="message" placeholder="Message"></textarea>
      </div>
    
      <div class="full">
        <button type="button" class="btn btn-primary" onclick="sendEmail()">Send Message</button>
      </div>
    </div>
</section>

<footer class="footer">
  <div class="container footer-row"><div>MED UIUC</div><div>Contact Page</div></div>
</footer>
</body>
</html>
